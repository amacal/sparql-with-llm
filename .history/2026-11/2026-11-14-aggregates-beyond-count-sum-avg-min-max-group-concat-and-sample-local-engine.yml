    - "Stated the SUM of integers is xsd:integer because the base-case 0 is an integer; corrected: the result type follows both operands of each op:numeric-add, so a decimal operand promotes the result"
    - "Guessed that the left operand's type decides the result; corrected with the F&O §6.2 rule that the lower-ranked operand is promoted to the other's type"
    - "Treated xs: and xsd: as a difference between engines; corrected: both are prefixes for the same namespace, and xsd:int versus xsd:integer is the real distinction"
    - "Predicted q2 returns xsd:double because Turtle reads 40.0 as double; observed xsd:decimal on all seven engines; corrected via Turtle §2.5.2 (only an exponent makes a bare number a double)"
