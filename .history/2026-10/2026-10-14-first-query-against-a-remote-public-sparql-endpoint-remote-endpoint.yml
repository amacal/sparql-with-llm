date: "2026-10-14"
title: "First Query Against a Remote Public SPARQL Endpoint (remote-endpoint)"
session:
  file: remote-endpoint/remote-first-query/
  status: completed
  attempted:
    - "Query a real public SPARQL endpoint whose data the user did not write, and still compare a hand-derived expected result against the actual one, by first inspecting a bounded slice, proving it complete, then predicting a further query from that slice alone"
  explored:
    - "How an expected result can be derived without a local dataset file; framed as inspecting a bounded slice first"
    - "What decides which rows LIMIT returns without ORDER BY; restated as the engine's internal order, not random, and possibly served from cache (cache-control: max-age=2592000)"
    - "Which triple position states what a triple is about, using a generic foaf Alice/Bob example"
    - "Fixing the object to a name to discover a subject IRI, and the plain versus language-tagged literal term-equality question"
    - "SPARQL 1.1 Protocol §2.1.7 failure responses (400 versus 500), fetched and quoted verbatim"
    - "RDF Schema 1.1 §3.6 rdfs:label definition and the rdfs: namespace IRI, fetched and quoted verbatim"
    - "Four possible explanations for an empty result on data not written by the user (no resource, different predicate, different spelling/case, different or no language tag)"
    - "A control query (same shape, a name certain to exist) to separate a broken query shape from an absent name"
    - "Fewer rows than the LIMIT as the completeness test for a slice"
    - "The owl: namespace IRI and what owl:sameAs states, read from the q5 output"
    - "A pattern with every position fixed: a generic foaf example showing \"bindings\": [ {} ] for a match and [ ] for no match"
    - "SPARQL 1.1 Query §16.1.1 (SELECT *) and §5.2.1 (empty group pattern), fetched and quoted verbatim"
    - "DBpedia's endpoint page fetched and quoted verbatim: ResultSetMaxRows = 10000, MaxQueryExecutionTime = 120, partial results returned with 200 OK, X-SPARQL-MaxRows and X-SQL-State/X-SQL-Message/X-Exec-Milliseconds/X-Exec-DB-Activity headers"
    - "Why q1 with a large limit is unsuitable on a shared endpoint (cap, server load, unprovable completeness)"
  tried:
    - "q1.rq first version had no LIMIT; not run, LIMIT 10 added by the user before running"
    - "q2.rq fixed only the object to \"Tentris\"@en; HTTP 500, retried once after 5 seconds with the same error"
    - "q3.rq first version fixed the predicate to rdfs:label but left the object as ?label; not run, object \"Tentris\"@en put back by the user"
    - "Proposed filtering out system IRIs by prefix to make q1 useful; set aside as still arbitrary and needing untaught string functions"
    - "Proposed discovering all predicates with DISTINCT first; set aside in favour of fixing the subject"
    - "q6.rq run at limit 100, then raised to limit 1000 by the user"
    - "Checked each fixed object in q7/q8 against the saved 149-object list with grep before running"
  corrections:
    - "Described rows returned under LIMIT without ORDER BY as random; restated as the engine's internal order, unspecified by the standard and often repeatable"
    - "Proposed fixing the predicate to get triples about one thing; corrected to the subject, since the predicate states what kind of fact, not whom it is about"
    - "Predicted a plain literal \"Tentris\" would fall back to a default tag such as @en and match \"Tentris\"@en; corrected: xsd:string versus rdf:langString with tag en are different terms, and SPARQL matching applies no fallback"
    - "Proposed the 'a' (rdf:type) predicate for a thing's name; corrected: rdf:type states class membership, rdfs:label states a human-readable name"
    - "Predicted q3 (\"Tentris\"@en via rdfs:label) would return 1 row; observed 0 rows"
    - "Predicted q4 (\"Munich\"@en via rdfs:label) would return exactly 1 row; observed 2 (dbr:Munich and dbr:Category:Munich); corrected the assumption that a label is unique to one resource"
    - "Predicted q5 (Munich ?p ?o, limit 100) would return fewer than 100 rows; observed exactly 100, with no rdfs:label row although q4 had shown one exists"
    - "Predicted q6 (Munich owl:sameAs ?o, limit 100) would return fewer than 100; observed exactly 100; at limit 1000 observed 149"
    - "Stated that only explanations 3 or 4 remained possible for Tentris after the Munich control; corrected: all four remain possible for Tentris, the control only rules out a broken query shape"
    - "Answered 'also []' for the standard q8 result (ambiguous between vars and bindings); corrected via §5.2.1 to bindings [ {} ], one solution binding nothing"
  bugs_found:
    - "DBpedia (Virtuoso 08.03.3335) returned HTTP 500 'Virtuoso 22023 Error SR549: Both datatype id 310 and language id 295 are not default in call of rdf_box()' for the legal pattern ?subject ?predicate \"Tentris\"@en; reproducible on retry; engine defect, worked around by also fixing the predicate"
    - "DBpedia (Virtuoso 08.03) answered SELECT * over a variable-free pattern with \"vars\": [\"_star_fake\"] and, on a match, a solution binding _star_fake to \"1\"^^xsd:integer, instead of an empty vars list and an empty solution; engine artifact, not resolved"
  completed:
    - "Wrote q1.rq (?subject ?predicate ?object limit 10); predicted 10 rows all bound; observed 10 rows all bound, all subjects Virtuoso virtrdf system metadata"
    - "Wrote q3.rq (?subject rdfs:label \"Tentris\"@en limit 10); observed HTTP 200 with zero bindings"
    - "Wrote q4.rq (?subject rdfs:label \"Munich\"@en limit 10); observed dbr:Munich and dbr:Category:Munich"
    - "Wrote q5.rq (dbr:Munich ?predicate ?object limit 100); observed 100 rows: 89 owl:sameAs, 7 rdf:type, 4 rdfs:seeAlso, 0 rdfs:label"
    - "Wrote q6.rq with declared PREFIXes (res:Munich owl:sameAs ?object limit 1000); predicted fewer than 1000; observed 149 rows and no X- response headers, accepted as a complete slice"
    - "Wrote q7.rq (all positions fixed, object wikidata Q1726X, absent from the slice); predicted empty bindings; observed \"bindings\": [ ]"
    - "Wrote q8.rq (all positions fixed, object wikidata Q1726, present in the slice); predicted one element; observed one element"
    - "Stated the standard result for q8 as \"vars\": [] with \"bindings\": [ {} ], derived from §16.1.1 and §5.2.1"
    - "Answered the three-level sign-off: q7/q8 observable results versus the standard; q6's match/project/slice pipeline with LIMIT never reached; narrowing one fixed position at a time to reach a readable, provably complete slice, and why q1 with a large limit is unsuitable"
  not_completed:
    - "Whether DBpedia has a Tentris resource was not resolved; Wikipedia was not checked"
    - "Language selection with lang()/langMatches() was planned but not reached"
    - "No execution plan was fetched from the endpoint"
  open_questions:
    - "Whether a standards-conforming second engine returns \"vars\": [] and \"bindings\": [ {} ] for a SELECT * over a variable-free matching pattern, as derived from the spec but not observed"
    - "Which of the four explanations accounts for q3's empty result for \"Tentris\"@en"
    - "Whether the engine evaluated q6 with a subject-predicate index lookup (hypothesis, no plan observed)"
    - "Why q2's object-only tagged-literal pattern fails with SR549 while the same literal with a fixed predicate (q3, q4) succeeds"
  notes:
    - "Endpoint: DBpedia, https://dbpedia.org/sparql, server header Virtuoso/08.03.3334 and Virtuoso/08.03.3335 (two builds answered behind the same URL); chosen by the plan agent's live lookup as mainstream, free, credential-free, with a flat data model and documented silent result caps relevant to the ORDER BY session's open question; Wikidata Query Service was the runner-up"
    - "All requests were POST with URL-encoded query (SPARQL 1.1 Protocol §2.1.2) via curl, Accept: application/sparql-results+json, User-Agent sparql-with-llm-learning-repo/1.0 (curl), apart from the plan agent's initial ASK reachability check"
    - "Responses carried cache-control: max-age=2592000"
    - "DBpedia documents that a row-capped result carries X-SPARQL-MaxRows; this resolves the ORDER BY session's open question about whether Virtuoso signals ResultSetMaxRows truncation, for this endpoint"
    - "q1 returned the engine's own virtrdf metadata, showing the endpoint's default dataset includes system triples; named graphs were not taught"
    - "First remote-endpoint session in this repo; results are a snapshot as of 2026-10-14"
