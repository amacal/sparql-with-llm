  attempted:
    - "Hand-write six queries over a reused dataset covering HAVING on an aggregate, an aggregate in a WHERE FILTER, a SELECT alias inside HAVING, and HAVING with implicit grouping over matching and non-matching patterns, predicting each result by hand and checking it on a primary engine plus a silent four-engine panel"
  explored:
    - "Recap checks: FILTER keeps only T (with !bound(?x) as the way to keep unbound rows), and COUNT(*) counts the solutions in a group"
    - "§11.3, §18.2.4.1, §18.2.4.2, §18.2.4.4 and §18.5.1.8 (Sample), grammar rules [21], [22], [69], [120], [121] and the §19.8 grammar note on where aggregates may appear, all fetched live from the raw W3C page and quoted verbatim"
    - "Chat-only foaf:knows example: groups :ann 2, :bob 1, :dan 3 under HAVING(COUNT(*) > 1)"
    - "Order of WHERE FILTER, grouping and HAVING filter, and what a single solution can and cannot see"
    - "Oxigraph query --explain trees for q2 and q3, including the direction solutions flow through a plan tree"
    - "Chat-only SAMPLE example (:ann with two nicks, :bob with none) before applying the Sample rewrite to q4"
    - "Why explicit GROUP BY over zero solutions gives zero groups while the implicit group's constant key gives one row"
  tried:
