    - "Stated that Tentris's q4 parse error is the correct behaviour; corrected: the Sample rewrite makes the query legal, so the specification gives zero rows"
    - "Explained q5's rejection as HAVING having no groups; corrected: Group((1), P) forms one group keyed by the constant 1, and ?person is not a group key, so the §11.4 projection restriction applies"
