  corrections:
    - "Predicted Monica's COUNT(?employer) as 0; corrected to 1 from her rel:worksAt cmp:Oracle triple"
    - "Described FILTER as working with triple patterns; restated as evaluating once per solution and returning the solutions whose expression is T"
    - "Read Oxigraph's plan as passing a binding down from Extend to Filter; corrected: solutions flow upward, the hidden variable is first bound by Aggregate, and an operation sees only variables bound below it"
    - "Predicted q3 is a parse error; observed HTTP 200 with zero rows on Oxigraph and RDF4J and HTTP 400 on Tentris, Fuseki and QLever; diagnosed from the Oxigraph plan as a Filter below Aggregate testing an unbound hidden variable"
