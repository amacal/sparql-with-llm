date: "2026-10-13"
title: "ORDER BY with LIMIT and OFFSET: Ordered Slices of a Solution Sequence (local-engine)"
session:
  file: local-engine/modifier-order-slice/
  status: completed
  attempted:
    - "Hand-write a dataset and queries exercising ORDER BY over unbound values, a blank node and same-typed literals, then LIMIT/OFFSET slices of the ordered sequence, predicting each result by hand and checking it on two engines"
  explored:
    - "What a page such as results 11-20 needs in order to be stable; framed as every row needing a unique position, so ties must be broken"
    - "Character-by-character string comparison, using \"9\" versus \"10\" as the pair whose string order and integer order disagree"
    - "Why a value-less subject needs a triple matched by the required pattern to appear at all, using a generic foaf example (Alice and Carol)"
    - "§15 and §15.1 fetched live and quoted verbatim: term-kind ranking, the < operator on same-typed pairs, the undefined-order examples, and tie handling across comparators"
    - "Option A (one type per sorted variable, fully derivable) versus option B (mixed types, partial expected order); A chosen, B deferred"
    - "Casting inside ORDER BY, raised by the user from SQL experience; noted as legitimate (comparators are expressions, §17.5) and kept out of scope"
    - "SelectClause [9] and OrderClause [23] grammar rules, fetched and quoted verbatim"
    - "§15.4 OFFSET and §15.5 LIMIT, fetched and quoted verbatim"
    - "§18.2.5 solution-modifier pipeline (ToList, OrderBy, Project, Distinct, Reduced, Slice), fetched and quoted verbatim"
    - "Whether a server-side result cap (Virtuoso ResultSetMaxRows) can stand in for ORDER BY with LIMIT for paging"
    - "Hypothetical second person named Bob, to test whether ?name alone guarantees a total order"
  tried:
    - "Loaded data.ttl into Virtuoso with isql DB.DBA.TTLP into the named graph urn:ex:modifier-order-slice, and queried with the protocol's default-graph-uri parameter"
    - "Loaded data.ttl into Tentris with a Graph Store Protocol PUT /graph-store?default; dumped both stores with CONSTRUCT and compared them against the file"
    - "Diagnostic probes on Virtuoso: integer rows only (FILTER isLiteral), projected (?age < 10), ORDER BY (?age + 0), VALUES { 16 9 } ORDER BY, and the stored __tag(O) of the age objects (189)"
    - "Ran the earlier comma version of q1's SELECT clause against Tentris from a copy under .tmp"
    - "Searched for official Virtuoso documentation explaining its ordering of stored typed literals, and fetched OpenLink's endpoint-protection page for ResultSetMaxRows"
    - "Tried rdflib for a parse check before loading; it was not installed and pip was unavailable, so the engines' loaders were used as the parse check"
  corrections:
    - "Answered that the generic one-person foaf example returns 0 rows because Carol was absent; corrected to 1 row (Alice), with Carol producing no row because nothing binds ?p to her"
    - "Predicted a simple literal \"9\" and an xsd:integer 10 would sort as simple literals with 10 first; §15.1 says the relative order of that pair is undefined"
    - "Hypothesised that Virtuoso's Ben/James order was undefined because the ?age column mixed a blank node with integers; corrected: ordering compares pairs of solutions, so only 9 versus 16 is compared, which is a defined pair"
    - "Guessed OFFSET counts from position 0; corrected via §15.4's wording that solutions start after the specified number"
    - "Described the order without ORDER BY as a specific sequence, then as random; restated as unspecified, which allows any order, including one that looks sorted"
    - "Attributed Tentris's Carol-before-Bob order in q1 to a failure to resolve the tie; corrected: q1 has no tie-breaker, so the order is undefined and both engines conform"
    - "Stated that ordering by ?name makes the result stable; refined to stable only for this dataset, since full stability needs the keys together to be unique per solution (?person as the final key)"
    - "Explained ?person's uniqueness as pointer-level comparison; §15.1 says IRIs are compared as simple literals"
  bugs_found:
