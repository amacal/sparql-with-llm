claim: "QLever stores xsd:integer literals from a loaded dataset as xsd:int and returns COUNT and SUM results as xsd:int, where SPARQL 1.1 gives COUNT the datatype xsd:integer and F&O op:numeric-add(xs:integer, xs:integer) returns xs:integer"
status: "observed on QLever in six sessions (2026-10-14, 2026-10-17, 2026-10-25 with digest 1ef17d17, 2026-11-03 with digest fa1490b9, 2026-11-14 with digest 565dd62b, 2026-11-21 with digest 56149879 where it also stored \"150\"^^xsd:double as xsd:decimal), images not pinned to the same digest; Oxigraph, Tentris, Fuseki 6.2.0, RDF4J 6.1.0, Virtuoso 7.2.17 and MillenniumDB returned xsd:integer for the same queries"
