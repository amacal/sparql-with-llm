claim: "SPARQL 1.1 §18.5.1.3 defines Sum over Flatten(M) with no remove-error step, so SUM over a group where one solution leaves the argument unbound (ListEval gives (error)) is an error and the projected variable is unbound; RDF4J and Virtuoso instead skip the unbound value and return the sum of the rest"
